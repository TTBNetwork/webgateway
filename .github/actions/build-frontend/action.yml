name: "Build Dashboard Frontend"
description: "Build Dashboard Frontend for release or debug"

inputs:
  node-version: # 新增：Node.js 版本输入
    description: "Node.js version to use"
    required: false
    default: 24 # 默认使用 Node.js 20 LTS
  pnpm-version: # 包管理器版本；与 package.json 的 packageManager 字段保持一致
    description: "pnpm version to use"
    required: false
    default: "12.8.1"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # 前端包管理器为 pnpm（2026-10-02 从 yarn 迁移）。
    # 用 pnpm/action-setup 固定版本，避免依赖 Corepack 的隐式下载。
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Checkout repository
      uses: actions/checkout@v2

    # build it
    - name: Build and copy build artifacts
      shell: bash
      run: |
        cd dashboard/frontend
        # 用冻结锁文件安装：lockfile 与 package.json 不一致时直接失败，
        # 而不是静默解析出与本地不同的依赖树。
        pnpm install --frozen-lockfile
        pnpm build

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webgateway-dashboard-frontend
        path: dashboard/frontend/dist/*

    - name: Prepare frontend
      shell: bash
      run: |
        mkdir ./dashboard/frontend/run/dist
        ls ./dashboard/frontend/dist

        cp -r ./dashboard/frontend/dist/* ./dashboard/frontend/run/dist/
        ls ./dashboard/frontend/run/dist

    - name: Build frontend dashboard and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./dashboard/frontend
        push: true
        tags: |
          ghcr.io/${{ env.LOWER_REPO }}/dashboard-frontend:latest
          ghcr.io/${{ env.LOWER_REPO }}/dashboard-frontend:${{ github.sha }}
          ghcr.io/${{ env.LOWER_REPO }}/dashboard-frontend:${{ env.RELEASE_VERSION }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
