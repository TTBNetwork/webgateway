[package]
edition = "2024"
rust-version = "1.92.0"
name = "acmex"
version = "0.8.0"
authors = ["houseme <housemecn@gmail.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "AcmeX: High-performance, extensible ACME v2 (RFC 8555) client and server in Rust, supporting multiple DNS providers, storage backends, and crypto libraries."
homepage = "https://houseme.github.io/acmex"
documentation = "https://docs.rs/acmex"
readme = "README.md"
keywords = [
    "acme",
    "tls",
    "certificate",
    "https",
    "letsencrypt",
]
categories = [
    "web-programming",
    "api-bindings",
    "asynchronous",
    "cryptography",
    "network-programming",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/houseme/acmex"

[features]
aws-lc-rs = ["dep:aws-lc-rs"]
cli = []
default = ["aws-lc-rs"]
dns-alibaba = []
dns-azure = []
dns-cloudflare = []
dns-cloudns = []
dns-digitalocean = []
dns-godaddy = []
dns-google = []
dns-huawei = []
dns-linode = []
dns-route53 = [
    "dep:aws-config",
    "dep:aws-sdk-route53",
]
dns-tencent = []
google-ca = []
metrics = []
redis = ["dep:redis"]
ring-crypto = ["dep:ring"]
zerossl-ca = []

[lib]
name = "acmex"
path = "src/lib.rs"

[[bin]]
name = "acmex"
path = "src/main.rs"

[[example]]
name = "advanced_scheduler"
path = "examples/advanced_scheduler.rs"

[[example]]
name = "api_server_custom"
path = "examples/api_server_custom.rs"

[[example]]
name = "basic_issuance"
path = "examples/basic_issuance.rs"

[[example]]
name = "dns_01_challenge"
path = "examples/dns_01_challenge.rs"

[[test]]
name = "account_test"
path = "tests/account_test.rs"

[[test]]
name = "api_test"
path = "tests/api_test.rs"

[[test]]
name = "order_test"
path = "tests/order_test.rs"

[dependencies.async-trait]
version = "0.1"

[dependencies.aws-config]
version = "1.8"
optional = true

# === WebGateway 本地补丁（2026-10-02）===
# 上游 acmex 0.8.0 在这里硬编码了 `features = ["fips"]`，导致任何下游都会编译
# FIPS 验证版后端 aws-lc-fips-sys；该后端的 bcm-delocated.S 在较新的 binutils
# （本机 2.46 / GCC 15.2）上会因为 ".data section found in module" 直接构建失败，
# 使得整个 workspace 无法产出 release 二进制。
#
# acmex 自身**只有一处**用到 aws-lc-rs（src/storage/encrypted.rs 的 AES-256-GCM），
# 与 FIPS 认证无关，因此去掉 `fips` 后改用非 FIPS 的 aws-lc-sys，功能完全等价
# （同一套 AES-GCM 实现，只是不做 FIPS 自检）。
[dependencies.aws-lc-rs]
version = "1.15.4"
optional = true

