[package]
name = "dashboard"
version.workspace = true
edition.workspace = true

[[bin]]
name = "dashboard"
path = "src/main.rs"

[dependencies]
acmex.workspace = true
anyhow.workspace = true
axum.workspace = true
data-encoding = "2.11.1"
