[package]
name = "dashboard"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
axum = { version = "0.8.8", features = ["macros"] }
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.49.0", features = ["full"] }
toml = "1.0.1"
utils = { path = "../../crates/utils", version = "0.1.0" }
shared = { path = "../../crates/shared", version = "0.1.0" }
tracing = "0.1.44"
serde_json = "1.0.149"
units-formatter = "0.1.1"
tower-http = { version = "0.6.8", features = ["catch-panic"] }
tokio_schedule = "0.3.2"
jsonwebtoken = { version = "10.3.0", features = ["aws_lc_rs"] }
totp-rs = { version = "5.7.0", features = ["qr", "serde_support"] }
rand = "0.10.0"
base64 = "0.22.1"
qrcode = "0.14.1"
chrono = { version = "0.4.43", features = ["serde"] }
async-trait = "0.1.89"
axum-client-ip = "1.3.1"
client-ip = "0.2.1"
# 实际来源是本地 vendored 副本（见根 Cargo.toml 的 [patch.crates-io] 与 vendor/acmex）。
# 这里仍写 crates.io 版本号，由 patch 重定向，便于日后上游修复后一行回退。
acmex = { version = "0.8.0", features = ["dns-tencent", "zerossl-ca"] }
geoip2 = "0.1.8"
ipdb = "0.1.4"
ttl_cache = "0.5.1"


[[bin]]
name = "dashboard"
path = "src/main.rs"

[dev-dependencies]
# 仅用于集成测试：直接对 Router 发请求，不必真的监听端口。
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
