# Copy this file to config.toml (ignored by git) and adjust the values, or
# provide the same settings through environment variables (environment wins).

[database]
url = "postgres://user:password@host:5432/webgateway_beta_v2"
max_connections = 10
connect_timeout_secs = 10
init_lock_timeout_secs = 60
wait_timeout_secs = 300

[server]
port = 3000
# Service tokens accepted as `Authorization: Bearer <token>` by API clients.
# List more than one during a rotation window; `api_token` (singular) is the
# deprecated equivalent and is merged into the same list.
# api_tokens = ["change-me-0123456789abcdef"]
#
# The panel uses username + TOTP. On an empty users table the master creates an
# admin and logs its TOTP secret. The session JWT is delivered in the
# `wg_session` HttpOnly, SameSite=Strict cookie and is never exposed to scripts.
# Env overrides:
#   DASHBOARD_ADMIN_USERNAME / DASHBOARD_ADMIN_TOTP_SECRET / DASHBOARD_JWT_SECRET
#   DASHBOARD_TOKEN_EXPIRES (seconds, default 604800, clamped to 300..2592000)
#   DASHBOARD_API_TOKENS (comma-separated; DASHBOARD_API_TOKEN also accepted)
