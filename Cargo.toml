[workspace]
members = [
    "crates/shared",
    "dashboard/backend",
    "gateway",
    "mnt",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[patch.crates-io]
# The published acmex 0.8.0 hardcodes aws-lc-rs's "fips" feature, which fails
# to build on this toolchain. The vendored copy (same version, same license)
# only drops that hardcoded feature; see vendor/acmex and changelog.md.
acmex = { path = "vendor/acmex" }

[workspace.dependencies]
acmex = { version = "0.8.0", features = ["dns-tencent", "zerossl-ca"] }
anyhow = "1.0.101"
axum = "0.8.8"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "migrate",
    "macros",
] }
tokio = { version = "1.49.0", features = [
    "fs",
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = "1.0.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
