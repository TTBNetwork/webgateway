# Copy to config.toml (ignored by git) or provide the same values through
# environment variables. Environment values win.
#
# Set SECRET_ENCRYPTION_KEY to the same value as the dashboard when secrets are
# encrypted at rest, otherwise certificate private keys cannot be decrypted and
# those certificates are skipped (the default self-signed cert is served).

[database]
url = "postgres://user:password@host:5432/webgateway_beta_v2"
max_connections = 10
connect_timeout_secs = 10
wait_timeout_secs = 300

[node]
# name = "edge-1"
country = "CN"
city = "Shanghai"
# address = "203.0.113.10"

[server]
bind = "0.0.0.0"
ports = [80, 443]
# HTTP/3 over QUIC; empty disables the UDP listener.
# http3_ports = [443]
# Global in-memory cache limit (default 16 MiB).
# cache_max_size_bytes = 16777216
# Concurrent TCP connections across all listeners (default 4096).
# max_connections = 4096
# HTTP/1 buffer / HTTP/2 header-list limit (default 32 KiB, minimum 8 KiB).
# max_header_bytes = 32768
# Request body cap (default 64 MiB); larger Content-Length gets 413.
# max_request_body_bytes = 67108864
# Cached / HTTP/3 buffered response cap (default 64 MiB).
# max_response_body_bytes = 67108864
# Ports allowed as HTTP CONNECT tunnel targets (default [443, 80]).
# An empty list denies all CONNECT requests.
# connect_ports = [443, 80]
# Optional Prometheus metrics listener (plain HTTP). It is bound to loopback by
# default so it is never exposed on the public listener ports.
# metrics_port = 9102
# metrics_bind = "127.0.0.1"

# Per-client-IP token bucket. Disabled by default; setting
# GATEWAY_RATE_LIMIT_RPS enables it without a config file.
# [server.rate_limit]
# enabled = true
# requests_per_second = 20.0
# burst = 40
# max_tracked_ips = 100000

[upstream_tls]
# Gateway-wide fallback for https backends. Prefer per-site overrides:
# websites.config.upstream_tls = {"ca_file":"/path/ca.pem"} or {"insecure":true}.
# ca_file = "/etc/webgateway/upstream-ca.pem"
# Skip upstream certificate verification for self-signed lab backends.
# insecure = false
